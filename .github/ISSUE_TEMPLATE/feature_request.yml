name: Feature request
description: Suggest a narrowly scoped improvement to Hide Development Notice
title: "[Request]: "
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like changed?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: What problem would this solve?
      description: Explain why the change belongs in Hide Development Notice rather than a broader popup-blocking mod.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: Optional. If you have an implementation idea, describe it here.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is specifically related to the Manor Lords development notice or its compatibility.
          required: true
        - label: I checked existing issues for the same request.
          required: true
